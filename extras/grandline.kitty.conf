# Grand Line - Kitty Terminal Theme
# A dark, vibrant color scheme inspired by One Piece (Post-Timeskip & Wano Arc)
# https://github.com/gomezhyuuga/grandline.nvim

# Basic colors
foreground              #e6edf3
background              #0d1117
selection_foreground    #e6edf3
selection_background    #21262d

# Cursor colors
cursor                  #ff6b7a
cursor_text_color       #0d1117

# URL underline color
url_color               #58a6ff

# Tab bar colors
active_tab_foreground   #e6edf3
active_tab_background   #e63946
inactive_tab_foreground #8b949e
inactive_tab_background #161b22
tab_bar_background      #0d1117

# Mark colors (for marked text)
mark1_foreground        #0d1117
mark1_background        #58a6ff
mark2_foreground        #0d1117
mark2_background        #9d4edd
mark3_foreground        #0d1117
mark3_background        #00c8d4

# Normal colors (ANSI 0-7)
# color0: Blackbeard - Dark as the Yami Yami no Mi
color0                  #0d1117
