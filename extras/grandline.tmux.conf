# Grand Line - One Piece Color Scheme for Tmux
# Inspired by Post-Timeskip & Wano Arc aesthetics
#
# Usage: Add to your tmux.conf:
#   source-file /path/to/grandline.tmux.conf

# Color Palette
# -------------
# new_world_night:      #0d1117  (Primary background)
# calm_belt:            #161b22  (Secondary background)
# thousand_sunny_deck:  #21262d  (Selection / Highlight)
# sea_stone:            #484f58  (Muted text)
# log_pose:             #8b949e  (Secondary text)
# ponegliff_white:      #e6edf3  (Primary foreground)
# gear_red:             #e63946  (Red - Luffy)
# ichimonji:            #2d9d4f  (Green - Zoro)
# clima_tact:           #f77f00  (Orange - Nami)
# all_blue:             #2f7ebf  (Blue - Sanji)
# robin:                #9d4edd  (Purple - Robin)
# radical_beam_cyan:    #00c8d4  (Cyan - Franky)
# gear_fifth:           #ff6b7a  (Bright Red - Luffy Awakened)
# enma_glow:            #5bda7c  (Bright Green - Zoro's Enma)
# gol_d:                #fcbf49  (Bright Yellow - Wano gold)
# jinbe_tide:           #58a6ff  (Bright Blue - Jinbe)
# sakura_bloom:         #d970c4  (Bright Purple - Wano blossoms)
# soul_king_teal:       #56d4dd  (Bright Cyan - Brook)

# ─────────────────────────────────────────────────────────────
# Status Bar
# ─────────────────────────────────────────────────────────────

set -g status-style "bg=#161b22,fg=#e6edf3"
set -g status-position bottom
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100

# Left: Session name
set -g status-left "#[fg=#fcbf49,bg=#161b22,nobold]  #{server_sessions} #[fg=#0d1117,bg=#2d9d4f,bold] #S "

# Right: Continuum status, date and time
set -g status-right "#[fg=#9d4edd,bg=#161b22]#[fg=#0d1117,bg=#9d4edd,bold] 󰆓 #{continuum_status} #[fg=#21262d,bg=#9d4edd]#[fg=#8b949e,bg=#21262d,bold] 󰃭 %Y-%m-%d 󰀠 %H:%M #[fg=#fcbf49,bg=#21262d]#[fg=#0d1117,bg=#fcbf49,bold]  #h "

# ─────────────────────────────────────────────────────────────
# Window Status
# ─────────────────────────────────────────────────────────────

# Window separator
set -g window-status-separator ""

# Inactive window (rounded edges)
set -g window-status-format "#[fg=#21262d,bg=#161b22]#[fg=#8b949e,bg=#21262d,bold] #I #W #[fg=#21262d,bg=#161b22] "

# Active window (rounded edges)
set -g window-status-current-format "#[fg=#e63946,bg=#161b22]#[fg=#e6edf3,bg=#e63946,bold] #I #W #[fg=#e63946,bg=#161b22] "

# Window with activity
set -g window-status-activity-style "fg=#f77f00,bg=#21262d"

# Window with bell
set -g window-status-bell-style "fg=#e63946,bg=#21262d,bold"

# ─────────────────────────────────────────────────────────────
# Pane Borders
# ─────────────────────────────────────────────────────────────

set -g pane-border-style "fg=#e6b422"
set -g pane-active-border-style "fg=#e6b422"

# Pane number display
set -g display-panes-colour "#484f58"
set -g display-panes-active-colour "#fcbf49"

# ─────────────────────────────────────────────────────────────
# Message & Command Line
# ─────────────────────────────────────────────────────────────

set -g message-style "fg=#e6edf3,bg=#21262d"
set -g message-command-style "fg=#e6edf3,bg=#21262d"

# ─────────────────────────────────────────────────────────────
# Mode (Copy, etc.)
# ─────────────────────────────────────────────────────────────

set -g mode-style "fg=#ff6b7a,bg=#4b242c"

# ─────────────────────────────────────────────────────────────
# Clock
# ─────────────────────────────────────────────────────────────

set -g clock-mode-colour "#58a6ff"
set -g clock-mode-style 24

# ─────────────────────────────────────────────────────────────
# Misc
# ─────────────────────────────────────────────────────────────

# Copy mode highlight
set -g copy-mode-match-style "fg=#0d1117,bg=#fcbf49"
set -g copy-mode-current-match-style "fg=#0d1117,bg=#f77f00"

# Mark style
set -g copy-mode-mark-style "fg=#0d1117,bg=#9d4edd"
