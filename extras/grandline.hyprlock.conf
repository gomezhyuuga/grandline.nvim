# Grand Line - Hyprlock Color Theme
# A dark, vibrant color scheme inspired by One Piece (Post-Timeskip & Wano Arc)
# https://github.com/gomezhyuuga/grandline.nvim
#
# Source this from your ~/.config/hypr/hyprlock.conf, or use it as a starting point.

# ── Background ──────────────────────────────────────────────────────────────
background {
    monitor =
    color = rgba(0d1117ff)                                  # new_world_night

    # Prefer a wallpaper? Uncomment and point at your image:
    # path = ~/Pictures/wallpaper.png
    # blur_passes = 3
    # blur_size = 8
    # brightness = 0.6
}

# ── Input Field ─────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_center = true
    dots_size = 0.3
    dots_spacing = 0.3

    outer_color = rgba(e6b422ff)                            # straw
    inner_color = rgba(161b22ff)                            # calm_belt
    font_color = rgba(e6edf3ff)                             # ponegliff_white
    check_color = rgba(58a6ffff)                            # jinbe_tide
    fail_color = rgba(ff4500ff)                             # fire_fist
    capslock_color = rgba(fcbf49ff)                         # gol_d
    numlock_color = rgba(56d4ddff)                          # soul_king_teal
    bothlock_color = rgba(9d4eddff)                         # robin

    placeholder_text = <span foreground="##8b949e">Set sail...</span>
    fail_text = <span foreground="##ff6b7a">$FAIL ($ATTEMPTS)</span>

    shadow_color = rgba(0d1117cc)                           # new_world_night
    shadow_passes = 2

    position = 0, -80
    halign = center
    valign = center
}

# ── Clock ───────────────────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = rgba(e6edf3ff)                                  # ponegliff_white
    font_size = 90
    font_family = monospace

    shadow_color = rgba(0d1117cc)                           # new_world_night
    shadow_passes = 2

    position = 0, 120
    halign = center
    valign = center
}

# ── Date ────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(8b949eff)                                  # log_pose
    font_size = 20
    font_family = monospace

    shadow_color = rgba(0d1117cc)                           # new_world_night
    shadow_passes = 2

    position = 0, 40
    halign = center
    valign = center
}

# ── User Greeting ───────────────────────────────────────────────────────────
label {
    monitor =
    text = Welcome aboard, $USER
    color = rgba(e6b422ff)                                  # straw
    font_size = 16
    font_family = monospace

    shadow_color = rgba(0d1117cc)                           # new_world_night
    shadow_passes = 2

    position = 0, -160
    halign = center
    valign = center
}
